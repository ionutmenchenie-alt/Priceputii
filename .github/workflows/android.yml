name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # With the GOOGLE_SERVICES_JSON repository secret the APK talks to the real Firebase project;
      # without it, a placeholder lets the code compile and the tests run.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using the real Firebase config."
          else
            cp .github/ci/google-services.json app/google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; the APK will not connect to Firebase."
          fi

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: priceputii-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
